name: VEYNFITA Health Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health-check:
    name: Build, Run & Health Check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DIAGNOSTIC — Check MongoDB container status
        run: |
          echo "=== DIAGNOSTIC: MongoDB Container Status ==="
          docker ps -a
          echo ""
          echo "=== DIAGNOSTIC: MongoDB Container Logs ==="
          docker logs $(docker ps -a --filter "ancestor=mongo:6.0" --format "{{.ID}}") 2>&1 || echo "No MongoDB container found"
          echo ""
          echo "=== DIAGNOSTIC: Docker Network ==="
          docker network ls
          echo ""
          echo "=== DIAGNOSTIC: Port Check ==="
          netstat -tulpn 2>/dev/null | grep 27017 || echo "Port 27017 not listening"

      - name: Wait for MongoDB to be ready
        run: |
          echo "⏳ Waiting for MongoDB to be ready..."
          for i in {1..30}; do
            if mongosh --host 127.0.0.1 --port 27017 --eval "db.runCommand({ping: 1})" --quiet 2>/dev/null; then
              echo "✅ MongoDB is ready"
              exit 0
            fi
            echo "Attempt $i/30: MongoDB not ready yet"
            sleep 3
          done
          echo "❌ MongoDB failed to start"
          echo ""
          echo "=== DIAGNOSTIC: Final MongoDB Status ==="
          docker ps -a
          echo ""
          echo "=== DIAGNOSTIC: Final MongoDB Logs ==="
          docker logs $(docker ps -a --filter "ancestor=mongo:6.0" --format "{{.ID}}") 2>&1 || echo "No MongoDB container found"
          exit 1

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: development
          load: true
          tags: veynfita:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TESTING=true
            VERSION=dev
            BUILD_TIMESTAMP=$(date -u +%s)

      - name: Run Container
        run: |
          docker run -d \
            --name veynfita \
            --network ${{ job.container.network }} \
            -p 80:80 \
            -e _APP_ENV=development \
            -e _APP_OPTIONS_ABUSE=disabled \
            -e _APP_OPTIONS_FUNCTIONS=disabled \
            -e _APP_DB_HOST=mongodb \
            -e _APP_DB_PORT=27017 \
            -e _APP_DB_SCHEMA=appwrite \
            -e _APP_DB_USER= \
            -e _APP_DB_PASS= \
            -e _APP_DB_ADAPTER=mongodb \
            -e _APP_REDIS_HOST=redis \
            -e _APP_REDIS_PORT=6379 \
            -e _APP_OPENSSL_KEY_V1=$(openssl rand -hex 64) \
            veynfita:latest

      - name: Wait for Container to Start
        run: |
          echo "⏳ Waiting for container to start..."
          for i in {1..30}; do
            if docker ps | grep -q veynfita; then
              echo "✅ Container is running"
              break
            fi
            sleep 2
          done
          docker ps -a

      - name: Wait for Appwrite to Boot
        run: |
          echo "⏳ Waiting for Appwrite to boot (this may take 30-60 seconds)..."
          for i in {1..40}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/v1/health || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "✅ Appwrite is ready! (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/40: HTTP $HTTP_CODE"
            sleep 5
          done
          echo "❌ Appwrite failed to boot after 40 attempts"
          echo "--- Container logs (last 100 lines) ---"
          docker logs veynfita --tail 100
          exit 1

      - name: Verify Container Logs
        run: |
          echo "--- Last 20 lines of container logs ---"
          docker logs veynfita --tail 20
