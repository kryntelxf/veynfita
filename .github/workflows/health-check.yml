name: VEYNFITA Health Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health-check:
    name: Build, Run & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker Network
        run: |
          docker network create veynfita-net

      - name: Start MongoDB
        run: |
          docker run -d \
            --name mongodb \
            --network veynfita-net \
            --network-alias mongodb \
            -p 27017:27017 \
            mongo:6.0

      - name: Start Redis
        run: |
          docker run -d \
            --name redis \
            --network veynfita-net \
            --network-alias redis \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for MongoDB
        run: |
          echo "⏳ Waiting for MongoDB to be ready..."
          for i in {1..30}; do
            if docker exec mongodb mongosh --eval "db.runCommand({ping: 1})" --quiet 2>/dev/null; then
              echo "✅ MongoDB is ready"
              exit 0
            fi
            echo "Attempt $i/30: MongoDB not ready yet"
            sleep 3
          done
          echo "❌ MongoDB failed to start"
          docker logs mongodb
          exit 1

      - name: Wait for Redis
        run: |
          echo "⏳ Waiting for Redis to be ready..."
          for i in {1..30}; do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "✅ Redis is ready"
              exit 0
            fi
            echo "Attempt $i/30: Redis not ready yet"
            sleep 3
          done
          echo "❌ Redis failed to start"
          docker logs redis
          exit 1

      - name: Build VEYNFITA Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: development
          load: true
          tags: veynfita:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TESTING=true
            VERSION=dev
            BUILD_TIMESTAMP=$(date -u +%s)

      - name: Run VEYNFITA Container
        run: |
          docker run -d \
            --name veynfita \
            --network veynfita-net \
            --network-alias veynfita \
            -p 80:80 \
            -e _APP_ENV=development \
            -e _APP_OPTIONS_ABUSE=disabled \
            -e _APP_OPTIONS_FUNCTIONS=disabled \
            -e _APP_DB_HOST=mongodb \
            -e _APP_DB_PORT=27017 \
            -e _APP_DB_SCHEMA=appwrite \
            -e _APP_DB_USER= \
            -e _APP_DB_PASS= \
            -e _APP_DB_ADAPTER=mongodb \
            -e _APP_REDIS_HOST=redis \
            -e _APP_REDIS_PORT=6379 \
            -e _APP_OPENSSL_KEY_V1=$(openssl rand -hex 64) \
            veynfita:latest

      - name: Wait for Container to Start
        run: |
          echo "⏳ Waiting for VEYNFITA container to start..."
          for i in {1..30}; do
            if docker ps | grep -q veynfita; then
              echo "✅ Container is running"
              break
            fi
            sleep 2
          done
          docker ps -a

      - name: Wait for Appwrite to Boot
        run: |
          echo "⏳ Waiting for Appwrite to boot (this may take 30-60 seconds)..."
          for i in {1..40}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/v1/health || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "✅ Appwrite is ready! (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/40: HTTP $HTTP_CODE"
            sleep 5
          done
          echo "❌ Appwrite failed to boot after 40 attempts"
          echo "--- VEYNFITA container logs (last 100 lines) ---"
          docker logs veynfita --tail 100
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker stop veynfita mongodb redis 2>/dev/null || true
          docker rm veynfita mongodb redis 2>/dev/null || true
          docker network rm veynfita-net 2>/dev/null || true
