name: VEYNFITA Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: development
          load: true
          tags: veynfita:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TESTING=true
            VERSION=dev
            BUILD_TIMESTAMP=$(date -u +%s)

      - name: Verify Image
        run: |
          docker images
          docker image inspect veynfita:latest > /dev/null && echo "✅ Image built successfully"
