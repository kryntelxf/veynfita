name: VEYNFITA Baseline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  baseline:
    name: Baseline Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Repository
        run: |
          echo "VEYNFITA baseline started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Baseline check completed successfully"
